name: GitHub Pages yayınlama

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
      - name: Pages ayarları
        uses: actions/configure-pages@v5
      # Derleme yok; yalnızca yayınlanacak dosyalar paketlenir.
      - name: Statik dosyaları hazırla
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css js assets _site/
          # Depodaki mevcut proje sayfasının adresini koru.
          if [ -d PROJE ]; then cp -R PROJE _site/; fi
          # Veri Tabanı I · Chen notasyonu çalışma atölyesi
          if [ -d chen-atolyesi ]; then cp -R chen-atolyesi _site/; fi
          # İnternet Programcılığı II · Laravel vize çalışma notu
          if [ -d laravel-vize ]; then cp -R laravel-vize _site/; fi
          # Python vize çalışma alanı (Hafta 1-4 PyCharm uygulamaları)
          if [ -d python-vize ]; then cp -R python-vize _site/; fi
          # Mesleki Yabancı Dil · İngilizce vize çalışma uygulaması
          if [ -d mesleki-ingilizce ]; then cp -R mesleki-ingilizce _site/; fi
          # Nesne Tabanlı Programlama I · Java vize çalışma alanı
          if [ -d ntp-vize ]; then cp -R ntp-vize _site/; fi
          # Konfeksiyonda Kalite Kontrol · vize çalışma sayfası (arkadaş için)
          if [ -d kalite-kontrol ]; then cp -R kalite-kontrol _site/; fi
          # Programlama Temelleri · C# 8 haftalık çalışma sayfası (arkadaş için)
          if [ -d programlama-temelleri ]; then cp -R programlama-temelleri _site/; fi
          # Programlama Temelleri · C++ 8 haftalık çalışma sayfası (arkadaş için)
          if [ -d cpp-temelleri ]; then cp -R cpp-temelleri _site/; fi
          # Görsel Programlama 2 · PhoneBookApp (ASP.NET Core MVC) vize provası
          if [ -d rehber-vize ]; then cp -R rehber-vize _site/; fi
          # 5 Kasım sınav günü planı (NTP-1, Görsel Programlama 2, İnternet Programcılığı II)
          if [ -d sinav-gunu ]; then cp -R sinav-gunu _site/; fi
          # Spam Makinesi · mesaj ve fotoğrafları absürt hızda yağdıran sayfa
          if [ -d spam ]; then cp -R spam _site/; fi
          # Veri Tabanı I · 1–7. haftaların çözümlü örnekleri (vize)
          if [ -d veri-tabani ]; then cp -R veri-tabani _site/; fi
      - name: Dosyaları yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
